<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>账户管理系统</title>
    <link href="../static/css/comm.css" rel="stylesheet">
    <link href="../static/css/index.css" rel="stylesheet">
</head>
<body>
<div class="progress-bar" id="progressBar"></div>

<div class="container">
    <div class="header-controls">
        <h1>账户管理系统</h1>
        <div class="header-buttons">
            <button class="secondary" id="toggleView">切换到状态监控</button>
            <button class="secondary" id="statisticsBtn" onclick="window.location.href='/statistics'">📊 统计分析</button>
            <button class="secondary" onclick="window.location.href='/proxy-collection-page'">🌐 代理集合</button>
            <button class="secondary" onclick="window.location.href='/config'">⚙️ 配置管理</button>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <div class="error" id="error" style="display: none;">
        <svg fill="currentColor" height="20" viewBox="0 0 20 20" width="20">
            <path clip-rule="evenodd"
                  d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                  fill-rule="evenodd"/>
        </svg>
        <span id="errorMessage"></span>
    </div>

    <!-- 账户管理部分 -->
    <div id="accountsSection">
        <div class="controls">
            <div class="control-group">
                <button id="fetchAll">获取全部账户</button>
                <button class="secondary" id="fetchPage">分页获取</button>
            </div>

            <div class="control-group">
                <input id="accountId" min="0" placeholder="输入账户ID" type="number">
                <button id="fetchSingle">获取单个账户</button>
                <button id="fetchSingleLock">获取单个(加锁)</button>
            </div>

            <input class="search-box" id="searchInput" placeholder="搜索账号或代码..." type="text">
        </div>

        <div class="controls">
            <div class="control-group">
                <select id="statusFilter">
                    <option value="">所有状态</option>
                    <option value="1">活跃</option>
                    <option value="0">禁用</option>
                </select>
                <select id="typeFilter">
                    <option value="">所有类型</option>
                    <option value="0">类型 0</option>
                    <option value="1">类型 1</option>
                    <option value="2">类型 2</option>
                </select>
                <button id="applyFilters">应用筛选</button>
                <button class="secondary" id="resetFilters">重置</button>
            </div>

            <div class="control-group">
                <label>
                    <input checked id="maskPasswords" type="checkbox"> 隐藏密码
                </label>
                <button id="exportCSV">导出CSV</button>
            </div>
        </div>

        <div class="table-container" id="tableContainer">
            <div class="loading" id="loading" style="display: none;">
                <svg fill="var(--dark-gray)" height="24" style="animation: spin 1s linear infinite;" viewBox="0 0 24 24"
                     width="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z"
                          opacity=".25"/>
                    <path d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z"/>
                </svg>
                <div>加载中...</div>
            </div>

            <table id="accountsTable">
                <thead>
                <tr>
                    <th width="80px">ID</th>
                    <th width="150px">账号</th>
                    <th width="120px">密码</th>
                    <th width="80px">类型</th>
                    <th width="100px">状态</th>
                    <th width="120px">代码</th>
                    <th width="180px">创建时间</th>
                    <th width="100px">操作</th>
                </tr>
                </thead>
                <tbody id="accountsBody">
                <!-- 数据将通过JavaScript动态填充 -->
                </tbody>
            </table>

            <div class="empty-state" id="emptyState" style="display: none;">
                <svg fill="none" height="48" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" width="48">
                    <path d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                <h3>没有数据</h3>
                <p>点击"获取全部账户"或"分页获取"按钮加载数据</p>
            </div>
        </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="firstPage">首页</button>
            <button id="prevPage">上一页</button>
            <span id="pageNumbers" style="display: flex; align-items: center; padding: 0 10px;"></span>
            <button id="nextPage">下一页</button>
            <button id="lastPage">末页</button>
        </div>

        <div class="pagination-info" id="paginationInfo"></div>
    </div>

    <!-- 状态监控部分 -->
    <div id="statusSection" style="display: none;">
        <div class="status-header">
            <h2>云机状态实时监控</h2>
            <div class="status-controls">
                <div class="connection-status" id="connectionStatus">
                    <span class="status-info">● 未连接</span>
                </div>
                <button onclick="showDeviceManager()" class="secondary">📱 设备管理</button>
                <button id="refreshAllStatus">刷新所有状态</button>
            </div>
        </div>

        <div class="table-container">
            <table id="statusTable">
                <thead>
                <tr>
                    <th width="200px">设备名称</th>
                    <th width="200px">运行状态</th>
                    <th width="80px">运行次数</th>
                    <th width="80px">成功次数</th>
                    <th width="80px">error次数</th>
                    <th width="80px">其他错误</th>
                    <th width="80px">模板ID</th>
                    <th width="80px">转发占比</th>
                    <th width="80px">手机号占比</th>
                    <th width="80px">辅助占比</th>
                    <th width="100px">国家</th>
                    <th width="160px">更新时间</th>
                    <th width="120px">操作</th>
                </tr>
                </thead>
                <tbody id="statusTableBody">
                </tbody>
            </table>

            <div class="empty-state" id="statusEmptyState" style="display: none;">
                <svg fill="none" height="48" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" width="48">
                    <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3>暂无状态数据</h3>
                <p>系统正在获取云机状态信息...</p>
            </div>
        </div>
    </div>

    <!-- 编辑设备配置弹窗 -->
    <div id="editDeviceModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3>⚙️ 编辑设备配置</h3>
                <button class="modal-close" onclick="closeEditDeviceModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editDeviceForm">
                    <input type="hidden" id="editPadCode">

                    <!-- 基础信息 -->
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <h4 style="margin: 0 0 10px 0; color: var(--text-color);">基础信息</h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>设备代码</label>
                                <input type="text" id="editPadCodeDisplay" disabled style="background: #e9ecef;">
                            </div>
                            <div class="form-group">
                                <label>设备名称</label>
                                <input type="text" id="editPadName" disabled style="background: #e9ecef;">
                            </div>
                        </div>
                    </div>

                    <!-- 模板配置 -->
                    <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <h4 style="margin: 0 0 10px 0; color: #1976d2;">🎯 模板配置</h4>
                        <div class="form-group">
                            <label>模板ID <span style="color: red;">*</span></label>
                            <input type="number" id="editTempleId" required placeholder="请输入模板ID">
                        </div>
                    </div>

                    <!-- 代理配置 -->
                    <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <h4 style="margin: 0 0 10px 0; color: #388e3c;">🌐 代理配置</h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>国家 <span style="color: red;">*</span></label>
                                <input type="text" id="editCountry" required placeholder="例如: 摩洛哥">
                            </div>
                            <div class="form-group">
                                <label>国家代码 <span style="color: red;">*</span></label>
                                <input type="text" id="editCode" required placeholder="例如: ma">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>代理URL <span style="color: red;">*</span></label>
                                <input type="url" id="editProxy" required placeholder="https://...">
                            </div>
                            <div class="form-group">
                                <label>时区 <span style="color: red;">*</span></label>
                                <input type="text" id="editTimeZone" required placeholder="例如: Africa/Casablanca">
                            </div>
                            <div class="form-group">
                                <label>语言 <span style="color: red;">*</span></label>
                                <input type="text" id="editLanguage" required placeholder="例如: English">
                            </div>
                            <div class="form-group">
                                <label>纬度 <span style="color: red;">*</span></label>
                                <input type="number" id="editLatitude" step="0.0001" required placeholder="例如: 35.7758">
                            </div>
                            <div class="form-group">
                                <label>经度 <span style="color: red;">*</span></label>
                                <input type="number" id="editLongitude" step="0.0001" required placeholder="例如: -5.7909">
                            </div>
                        </div>
                    </div>

                    <!-- 邮箱配置 -->
                    <div style="background: #fff3e0; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <h4 style="margin: 0 0 10px 0; color: #f57c00;">📧 邮箱配置</h4>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="editIsSecondaryEmail" style="width: auto;">
                                是否已绑定辅助邮箱
                            </label>
                            <small style="color: var(--dark-gray); margin-top: 5px; display: block;">
                                勾选表示该设备已完成辅助邮箱绑定
                            </small>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button onclick="closeEditDeviceModal()" class="secondary">取消</button>
                <button onclick="saveDeviceConfig()" class="save-btn">💾 保存配置</button>
            </div>
        </div>
    </div>

    <!-- 设备管理弹窗 -->
    <div id="deviceManagerModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 800px; max-height: 90vh;">
            <div class="modal-header">
                <h3>📱 设备代码管理</h3>
                <button class="modal-close" onclick="closeDeviceManager()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 统计信息 -->
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
                    <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: #1976d2;" id="configuredCount">0</div>
                        <div style="font-size: 12px; color: #666; margin-top: 5px;">已配置设备</div>
                    </div>
                    <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;" id="cloudTotalCount">0</div>
                        <div style="font-size: 12px; color: #666; margin-top: 5px;">云端可用</div>
                    </div>
                    <div style="background: #fff3e0; padding: 15px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: #f57c00;" id="notConfiguredCount">0</div>
                        <div style="font-size: 12px; color: #666; margin-top: 5px;">未配置设备</div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                    <button onclick="syncAllDevices()" class="add-btn">🔄 导入所有云端设备</button>
                    <button onclick="syncOnlineDevices()" class="add-btn">📡 仅导入在线设备</button>
                    <button onclick="removeInvalidDevices()" class="remove-btn">🗑️ 移除无效设备</button>
                </div>

                <!-- 设备列表 -->
                <div style="margin-bottom: 15px;">
                    <input type="text"
                           id="deviceSearchInput"
                           placeholder="搜索设备代码或名称..."
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"
                           oninput="filterDeviceList()">
                </div>

                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead style="position: sticky; top: 0; background: #f8f9fa;">
                        <tr>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">设备代码</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">状态</th>
                            <th style="padding: 10px; text-align: center; border-bottom: 2px solid #ddd;">配置</th>
                            <th style="padding: 10px; text-align: center; border-bottom: 2px solid #ddd;">操作</th>
                        </tr>
                        </thead>
                        <tbody id="deviceListBody">
                        <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeDeviceManager()" class="secondary">关闭</button>
            </div>
        </div>
    </div>
</div>
<script src="../static/js/comm.js"></script>
<script src="../static/js/index.js"></script>
</body>
</html>

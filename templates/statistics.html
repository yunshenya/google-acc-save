<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号增长统计 - 账户管理系统</title>
    <link href="../static/css/index.css" rel="stylesheet">
    <link href="../static/css/statistics.css" rel="stylesheet">
    <link href="../static/css/comm.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
<div class="statistics-container">
    <div class="stats-header">
        <h1>📊 账号增长统计</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="refresh-btn" id="refreshBtn" onclick="loadStatistics()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="refreshIcon">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="m3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                刷新数据
            </button>
            <button class="secondary" onclick="window.location.href='/'">返回主页</button>
        </div>
    </div>

    <!-- 统计摘要卡片 -->
    <div class="stats-summary" id="statsSummary">
        <!-- 通过JavaScript动态填充 -->
    </div>

    <!-- 多维度图表 -->
    <div class="chart-container">
        <div class="chart-tabs">
            <button class="tab-btn active" id="totalTab" onclick="switchChart('total')">📈 总账号数/小时</button>
            <button class="tab-btn" id="avgTab" onclick="switchChart('average')">📊 平均每设备账号/小时</button>
            <button class="tab-btn" id="forwardTotalTab" onclick="switchChart('forward_total')">📧 转发邮箱数/小时</button>
            <button class="tab-btn" id="forwardAvgTab" onclick="switchChart('forward_average')">📨 平均每设备转发邮箱/小时</button>
        </div>
        <h3 id="chartTitle">过去24小时总账号增长趋势</h3>
        <div class="time-range" id="timeRange"></div>
        <div class="chart-wrapper">
            <canvas id="growthChart"></canvas>
        </div>
    </div>

    <!-- 详细指标 -->
    <div class="metrics-grid">
        <div class="metric-card">
            <h4>📊 设备效率指标</h4>
            <div id="deviceMetrics">
                <!-- 通过JavaScript动态填充 -->
            </div>
        </div>

        <div class="metric-card">
            <h4>⏱️ 时间周期统计</h4>
            <div id="timeMetrics">
                <!-- 通过JavaScript动态填充 -->
            </div>
        </div>
    </div>

    <!-- 转发邮箱专项统计 -->
    <div class="metrics-grid" style="margin-top: 30px;">
        <div class="metric-card">
            <h4>📧 转发邮箱专项分析</h4>
            <div id="forwardEmailMetrics">
                <!-- 通过JavaScript动态填充 -->
            </div>
        </div>

        <div class="metric-card">
            <h4>📈 转发邮箱成功率趋势</h4>
            <div id="forwardEmailTrends">
                <!-- 通过JavaScript动态填充 -->
            </div>
        </div>
    </div>
</div>

<!-- 添加转发邮箱相关的样式 -->
<style>
    .tab-btn {
        white-space: nowrap;
        padding: 10px 16px;
        font-size: 13px;
    }

    .metric-card h4 {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .forward-email-highlight {
        background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
    }

    .forward-rate-indicator {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
    }

    .forward-rate-high {
        background-color: #d4edda;
        color: #155724;
    }

    .forward-rate-medium {
        background-color: #fff3cd;
        color: #856404;
    }

    .forward-rate-low {
        background-color: #f8d7da;
        color: #721c24;
    }

    @media (max-width: 768px) {
        .chart-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .tab-btn {
            font-size: 11px;
            padding: 8px 12px;
        }
    }
</style>

<script src="../static/js/comm.js"></script>
<script src="../static/js/statistics.js"></script>

<!-- 添加转发邮箱专项统计的 JavaScript -->
<script>
    // 扩展更新详细指标函数以包含转发邮箱专项分析
    function updateForwardEmailMetrics(data) {
        const forwardEmailMetrics = document.getElementById('forwardEmailMetrics');
        const forwardEmailTrends = document.getElementById('forwardEmailTrends');

        if (forwardEmailMetrics) {
            // 计算转发邮箱成功率等级
            function getForwardRateClass(rate) {
                if (rate >= 80) return 'forward-rate-high';
                if (rate >= 50) return 'forward-rate-medium';
                return 'forward-rate-low';
            }

            forwardEmailMetrics.innerHTML = `
            <div class="metric-row">
                <span class="metric-label">总转发邮箱成功率</span>
                <span class="metric-value">
                    <span class="forward-rate-indicator ${getForwardRateClass(data.forward_rate_total)}">
                        ${data.forward_rate_total}%
                    </span>
                </span>
            </div>
            <div class="metric-row">
                <span class="metric-label">24小时转发邮箱成功率</span>
                <span class="metric-value">
                    <span class="forward-rate-indicator ${getForwardRateClass(data.forward_rate_24h)}">
                        ${data.forward_rate_24h}%
                    </span>
                </span>
            </div>
            <div class="metric-row">
                <span class="metric-label">7天转发邮箱成功率</span>
                <span class="metric-value">
                    <span class="forward-rate-indicator ${getForwardRateClass(data.forward_rate_7d)}">
                        ${data.forward_rate_7d}%
                    </span>
                </span>
            </div>
            <div class="metric-row">
                <span class="metric-label">每设备平均转发邮箱效率</span>
                <span class="metric-value positive">${data.avg_forward_total_per_device}/设备</span>
            </div>
        `;
        }

        if (forwardEmailTrends) {
            // 计算趋势指标
            const trend1hTo24h = data.forward_rate_1h - data.forward_rate_24h;
            const trend24hTo7d = data.forward_rate_24h - data.forward_rate_7d;

            function getTrendIcon(trend) {
                if (trend > 5) return '📈 ↗️';
                if (trend < -5) return '📉 ↘️';
                return '➡️ →';
            }

            forwardEmailTrends.innerHTML = `
            <div class="metric-row">
                <span class="metric-label">1小时 vs 24小时趋势</span>
                <span class="metric-value">${getTrendIcon(trend1hTo24h)} ${trend1hTo24h > 0 ? '+' : ''}${trend1hTo24h.toFixed(1)}%</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">24小时 vs 7天趋势</span>
                <span class="metric-value">${getTrendIcon(trend24hTo7d)} ${trend24hTo7d > 0 ? '+' : ''}${trend24hTo7d.toFixed(1)}%</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">设备转发邮箱达成率</span>
                <span class="metric-value">${((data.avg_forward_24h_per_device / data.avg_24h_per_device) * 100).toFixed(1)}%</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">转发邮箱每小时增长率</span>
                <span class="metric-value positive">${data.avg_forward_per_device_per_hour_24h}/设备/小时</span>
            </div>
        `;
        }
    }

    // 修改原有的 updateMetrics 函数，在末尾添加转发邮箱专项分析
    const originalUpdateMetrics = updateMetrics;
    updateMetrics = function(data) {
        originalUpdateMetrics(data);
        updateForwardEmailMetrics(data);
    };
</script>
</body>
</html>
